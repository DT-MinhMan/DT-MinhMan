name: Generate Snake Animation

on:
  # Tự động chạy mỗi 24 giờ một lần
  schedule:
    - cron: "0 0 * * *" 
  
  # Cho phép bạn bấm nút chạy bằng tay
  workflow_dispatch:
  
  # Chạy mỗi khi bạn push code lên nhánh chính
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Bước 1: Khởi tạo ảnh con rắn từ biểu đồ của bạn
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Bước 2: Đẩy file ảnh vừa tạo lên một nhánh tên là 'output'
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
